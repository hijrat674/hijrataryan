<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Unit converter illustrated preview</title>
  <desc id="desc">An original illustration of a unit conversion application turning one kilometer into one thousand meters, with a ruler and category tabs.</desc>
