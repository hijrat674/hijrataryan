  <g font-family="Arial, sans-serif">
    <rect x="86" y="72" width="788" height="456" rx="28" fill="#fff" filter="url(#shadow)"/>
    <text x="126" y="130" font-size="26" font-weight="700" fill="#2e465a">Big ideas. Different units.</text><text x="126" y="154" font-size="13" fill="#8fa0ab">Simple conversions for everyday calculations</text>
    <rect x="126" y="184" width="709" height="49" rx="14" fill="#f3f6f8"/><rect x="132" y="190" width="170" height="37" rx="10" fill="#fff"/>
