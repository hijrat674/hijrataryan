    <rect x="518" y="261" width="317" height="145" rx="17" fill="#edf5e9"/><text x="541" y="291" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8fa182">TO</text><text x="541" y="348" font-size="51" font-weight="700" fill="#718b59">1,000</text><text x="541" y="379" font-size="15" fill="#95a285">Meters</text><path d="M802 372L808 378L814 372" fill="none" stroke="#a2b396" stroke-width="2" stroke-linecap="round"/>
