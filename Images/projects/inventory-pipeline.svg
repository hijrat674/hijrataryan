<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Sales and inventory data pipeline</title>
  <desc id="desc">An illustrated sales and inventory dashboard with a warehouse database, stock movement bars, and a connected source-to-report workflow.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff0dd"/><stop offset="1" stop-color="#e9eefc"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6b5971" flood-opacity=".11"/></filter>
    <style>text{font-family:Arial,Helvetica,sans-serif}.ink{fill:#2d3549}.muted{fill:#8d92a6}.small{font-size:12px}.label{font-size:10px;font-weight:700;letter-spacing:1.4px}</style>
  </defs>
  <path fill="url(#bg)" d="M0 0h960v600H0z"/>
