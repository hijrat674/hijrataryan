  <path d="M79 124h800" stroke="#edf0f5"/>
  <text x="82" y="164" font-size="24" font-weight="700" class="ink">Every movement, connected.</text>
  <text x="82" y="190" font-size="13" class="muted">A reliable path from daily transactions to useful reports.</text>
