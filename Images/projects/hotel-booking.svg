<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Hotel room booking illustrated preview</title>
  <desc id="desc">An original illustration of a room booking dashboard with a bed, three room choices, and a reservation button.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff2df"/><stop offset="1" stop-color="#f3e8ff"/></linearGradient>
    <linearGradient id="room" x2="0" y2="1"><stop stop-color="#fae8d2"/><stop offset="1" stop-color="#e9cfb4"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dy="16" stdDeviation="20" flood-color="#663d26" flood-opacity=".12"/></filter>
  </defs>
