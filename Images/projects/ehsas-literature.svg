<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="literature-title literature-desc">
  <title id="literature-title">Literature library illustrated preview</title>
  <desc id="literature-desc">A warm pastel digital library with a featured Pashto literature collection, book shelves, reading categories, and a saved reading list.</desc>
  <defs>
    <linearGradient id="literature-bg" x2="1" y2="1">
      <stop stop-color="#fff1e3"/>
      <stop offset="1" stop-color="#eee6f7"/>
    </linearGradient>
    <linearGradient id="literature-feature" x2="1" y2="1">
      <stop stop-color="#7e4f43"/>
      <stop offset="1" stop-color="#a46d59"/>
    </linearGradient>
    <linearGradient id="literature-cover" x2="0" y2="1">
      <stop stop-color="#6a3d33"/>
      <stop offset="1" stop-color="#44231f"/>
    </linearGradient>
    <filter id="literature-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dy="16" stdDeviation="20" flood-color="#633e39" flood-opacity=".13"/>
    </filter>
    <filter id="literature-book-shadow" x="-30%" y="-25%" width="165%" height="165%">
      <feDropShadow dx="4" dy="8" stdDeviation="7" flood-color="#432621" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#literature-bg)"/>
  <circle cx="80" cy="94" r="148" fill="#f8d9c1" opacity=".62"/>
  <circle cx="914" cy="565" r="176" fill="#ded3ef" opacity=".7"/>
  <path d="M714 0H960V118C909 156 834 153 789 119C753 92 728 50 714 0Z" fill="#f2d7c5" opacity=".55"/>

  <g font-family="Arial, sans-serif">
    <rect x="86" y="72" width="788" height="456" rx="28" fill="#fff" filter="url(#literature-shadow)"/>

    <!-- Library sidebar -->
    <rect x="86" y="72" width="178" height="456" rx="28" fill="#f8f2ec"/>
    <rect x="236" y="72" width="28" height="456" fill="#f8f2ec"/>
    <rect x="111" y="99" width="38" height="42" rx="7" fill="url(#literature-cover)"/>
    <path d="M117 105H143V135H117Z" fill="none" stroke="#d9aa71" stroke-width="1.5"/>
    <path d="M121 111H139M121 128H139" stroke="#d9aa71" stroke-width="1.2"/>
    <text x="160" y="116" font-size="14" font-weight="700" fill="#4b312d">Ehsas</text>
    <text x="160" y="135" font-size="10" letter-spacing="1.4" fill="#a17d70">DIGITAL LIBRARY</text>

    <rect x="105" y="170" width="136" height="42" rx="12" fill="#efe0d6"/>
    <path d="M119 185L128 180L137 185V198L128 203L119 198Z" fill="#8a594b"/>
    <path d="M123 187H133M123 191H133M123 195H130" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
    <text x="151" y="196" font-size="12" font-weight="700" fill="#72483e">Discover</text>

    <path d="M119 246H137M119 252H133M119 258H130" stroke="#b1968c" stroke-width="2" stroke-linecap="round"/>
    <text x="151" y="255" font-size="12" fill="#806d67">My shelf</text>
    <path d="M119 296H136V312H119ZM123 293V299M132 293V299" fill="none" stroke="#b1968c" stroke-width="2" stroke-linecap="round"/>
    <text x="151" y="307" font-size="12" fill="#806d67">Reading list</text>
    <path d="M119 348H136V365L128 360L119 365Z" fill="none" stroke="#b1968c" stroke-width="2" stroke-linejoin="round"/>
    <text x="151" y="359" font-size="12" fill="#806d67">Bookmarks</text>

    <rect x="105" y="441" width="136" height="59" rx="14" fill="#fff"/>
    <circle cx="127" cy="471" r="12" fill="#ead5c8"/>
    <path d="M121 473Q127 463 133 473M127 466V470" fill="none" stroke="#8d5c50" stroke-width="1.8" stroke-linecap="round"/>
    <text x="147" y="468" font-size="11" font-weight="700" fill="#5d4741">Quiet reading</text>
    <text x="147" y="484" font-size="9" fill="#a18d86">12 min today</text>

    <!-- Header and search -->
    <text x="294" y="116" font-size="12" font-weight="700" letter-spacing="1.4" fill="#a17f73">LITERATURE COLLECTION</text>
    <text x="294" y="148" font-size="25" font-weight="700" fill="#3f302d">Stories worth keeping.</text>
    <rect x="651" y="102" width="181" height="39" rx="19.5" fill="#f7f3f0"/>
    <circle cx="674" cy="121" r="7" fill="none" stroke="#a89289" stroke-width="2"/>
    <path d="M679 127L685 133" stroke="#a89289" stroke-width="2" stroke-linecap="round"/>
    <text x="696" y="126" font-size="11" fill="#a08e87">Search books</text>

    <!-- Featured collection -->
    <rect x="294" y="177" width="538" height="174" rx="20" fill="url(#literature-feature)"/>
    <circle cx="781" cy="203" r="64" fill="#fff" fill-opacity=".06"/>
    <circle cx="732" cy="349" r="77" fill="#fff" fill-opacity=".05"/>
    <text x="321" y="207" font-size="10" font-weight="700" letter-spacing="1.5" fill="#f3d9ce">FEATURED COLLECTION</text>
    <text x="321" y="239" direction="rtl" unicode-bidi="bidi-override" font-size="25" font-weight="700" fill="#fff" xml:lang="ps">د احساس ادبي نړۍ</text>
    <text x="321" y="265" font-size="12" fill="#f4ded6">Poetry, essays, and stories in one quiet place.</text>
    <rect x="321" y="289" width="119" height="37" rx="18.5" fill="#fff"/>
    <text x="380" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#815043">Start reading</text>
    <rect x="454" y="289" width="84" height="37" rx="18.5" fill="#fff" fill-opacity=".13" stroke="#fff" stroke-opacity=".35"/>
    <text x="496" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">18 books</text>

    <!-- Featured book illustration -->
    <g filter="url(#literature-book-shadow)">
      <path d="M654 203L750 193L765 317L668 327Z" fill="#2f211e" opacity=".3"/>
      <path d="M647 193L743 183L757 307L661 317Z" fill="url(#literature-cover)"/>
      <path d="M656 202L735 194L746 298L667 306Z" fill="none" stroke="#d9a45d" stroke-width="2"/>
      <path d="M670 213L723 207M680 289L733 283" stroke="#d9a45d" stroke-width="1.3"/>
      <path d="M693 225C705 232 712 242 714 254C707 247 700 245 692 246C688 237 688 231 693 225ZM694 246C684 242 676 244 669 251C672 239 680 230 691 226" fill="none" stroke="#d9a45d" stroke-width="1.7" stroke-linecap="round"/>
      <text x="706" y="273" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-size="16" font-weight="700" fill="#f1c179" transform="rotate(-6 706 273)" xml:lang="ps">ادب</text>
      <path d="M647 193L654 197L668 317L661 317Z" fill="#321b18" opacity=".7"/>
    </g>

    <!-- Shelves -->
    <text x="294" y="389" font-size="16" font-weight="700" fill="#4c3934">Browse the shelves</text>
    <text x="832" y="389" text-anchor="end" font-size="11" font-weight="700" fill="#9a6556">See all</text>

    <rect x="294" y="409" width="161" height="91" rx="15" fill="#fff4ec"/>
    <rect x="471" y="409" width="161" height="91" rx="15" fill="#f1f3ed"/>
    <rect x="648" y="409" width="184" height="91" rx="15" fill="#f3eff8"/>

    <!-- Poetry shelf -->
    <rect x="309" y="425" width="35" height="56" rx="5" fill="#bb725f"/>
    <path d="M316 433H337M316 474H337" stroke="#f6cfb2" stroke-width="1.5"/>
    <path d="M326 443C332 448 332 454 326 460C320 454 320 448 326 443Z" fill="none" stroke="#f6cfb2" stroke-width="1.3"/>
    <text x="358" y="441" font-size="10" font-weight="700" letter-spacing="1" fill="#b07768">POETRY</text>
    <text x="358" y="462" font-size="14" font-weight="700" fill="#5a403a">New voices</text>
    <text x="358" y="480" font-size="10" fill="#9d8279">6 books</text>

    <!-- Essays shelf -->
    <rect x="486" y="425" width="35" height="56" rx="5" fill="#6d8978"/>
    <path d="M494 435H513M494 441H513M494 447H508" stroke="#e2eee5" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M494 473H513" stroke="#d7e7dc" stroke-width="1.4"/>
    <text x="535" y="441" font-size="10" font-weight="700" letter-spacing="1" fill="#789183">ESSAYS</text>
    <text x="535" y="462" font-size="14" font-weight="700" fill="#3e5047">Ideas and life</text>
    <text x="535" y="480" font-size="10" fill="#809187">5 books</text>

    <!-- Stories shelf -->
    <rect x="663" y="425" width="35" height="56" rx="5" fill="#8370a8"/>
    <path d="M671 465Q680 446 690 465M675 450L681 441L687 450" fill="none" stroke="#eee7f8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="712" y="441" font-size="10" font-weight="700" letter-spacing="1" fill="#8e7cab">STORIES</text>
    <text x="712" y="462" font-size="14" font-weight="700" fill="#4d455c">Tales of home</text>
    <text x="712" y="480" font-size="10" fill="#8d8698">7 books</text>
  </g>
</svg>
