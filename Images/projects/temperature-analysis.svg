  <rect x="246" y="256" width="627" height="211" rx="17" fill="#fff" stroke="#e9edf5"/>
  <text x="266" y="284" font-size="15" font-weight="700" class="ink">Weekly trend</text>
  <circle cx="764" cy="279" r="4" fill="#6688f8"/><text x="776" y="284" font-size="11" class="muted">Celsius</text>
  <g stroke="#eef1f7"><path d="M306 316h535M306 354h535M306 392h535M306 429h535"/></g>
  <g font-size="10" class="muted"><text x="269" y="319">30°</text><text x="269" y="357">26°</text><text x="269" y="395">22°</text><text x="269" y="432">18°</text></g>
  <path d="M314 399C344 399 368 371 400 371S455 344 487 344s55 48 87 48 55-67 87-67 55 28 87 28 61 28 86 28v48H314Z" fill="url(#area)"/>
  <path d="M314 399C344 399 368 371 400 371S455 344 487 344s55 48 87 48 55-67 87-67 55 28 87 28 61 28 86 28" fill="none" stroke="#6688f8" stroke-width="3" stroke-linecap="round"/>
  <g fill="#fff" stroke="#6688f8" stroke-width="3"><circle cx="314" cy="399" r="4"/><circle cx="400" cy="371" r="4"/><circle cx="487" cy="344" r="4"/><circle cx="574" cy="392" r="4"/><circle cx="661" cy="325" r="5"/><circle cx="748" cy="353" r="4"/><circle cx="834" cy="381" r="4"/></g>
  <g font-size="10" class="muted" text-anchor="middle"><text x="314" y="450">MON</text><text x="400" y="450">TUE</text><text x="487" y="450">WED</text><text x="574" y="450">THU</text><text x="661" y="450">FRI</text><text x="748" y="450">SAT</text><text x="834" y="450">SUN</text></g>
  <rect x="246" y="483" width="627" height="48" rx="13" fill="#f6f8fc"/>
  <text x="265" y="512" font-size="12" font-weight="700" class="ink">Weekly sample</text><text x="438" y="512" font-size="12" class="muted">Min 21°</text><text x="565" y="512" font-size="12" class="muted">Max 29°</text><rect x="730" y="495" width="125" height="24" rx="12" fill="#e0f2ec"/><text x="748" y="511" font-size="10" font-weight="700" fill="#4c947f">✓ CLEAN DATA</text>
</svg>
