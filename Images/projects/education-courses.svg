<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="education-title education-desc">
  <title id="education-title">Education course catalog illustrated preview</title>
  <desc id="education-desc">A pastel learning dashboard with a Pashto course catalog, progress card, subject filters, and three illustrated course cards.</desc>
  <defs>
    <linearGradient id="education-bg" x2="1" y2="1">
      <stop stop-color="#e8f3ff"/>
      <stop offset="1" stop-color="#eee8ff"/>
    </linearGradient>
    <linearGradient id="education-banner" x2="1" y2="1">
      <stop stop-color="#566edb"/>
      <stop offset="1" stop-color="#7e67d9"/>
    </linearGradient>
    <linearGradient id="education-book" x2="0" y2="1">
      <stop stop-color="#ffcf83"/>
      <stop offset="1" stop-color="#f39f72"/>
    </linearGradient>
    <filter id="education-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dy="16" stdDeviation="20" flood-color="#394674" flood-opacity=".13"/>
    </filter>
    <filter id="education-card-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dy="7" stdDeviation="9" flood-color="#394674" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#education-bg)"/>
  <circle cx="72" cy="95" r="145" fill="#cfe8f3" opacity=".68"/>
  <circle cx="916" cy="556" r="174" fill="#dcd4f8" opacity=".72"/>
  <path d="M760 0H960V123C909 154 836 151 795 113C770 90 758 50 760 0Z" fill="#d6e8ff" opacity=".65"/>

  <g font-family="Arial, sans-serif">
    <rect x="86" y="72" width="788" height="456" rx="28" fill="#fff" filter="url(#education-shadow)"/>

    <!-- Navigation rail -->
    <rect x="86" y="72" width="76" height="456" rx="28" fill="#364b9c"/>
    <rect x="124" y="72" width="38" height="456" fill="#364b9c"/>
    <rect x="105" y="94" width="38" height="38" rx="12" fill="#fff" fill-opacity=".94"/>
    <path d="M113 108L124 102L135 108V122L124 128L113 122Z" fill="#6078dd"/>
    <path d="M117 111L124 115L131 111M124 115V123" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="103" y="164" width="42" height="42" rx="12" fill="#fff" fill-opacity=".18"/>
    <path d="M114 177H121V184H114ZM127 177H134V184H127ZM114 190H121V197H114ZM127 190H134V197H127Z" fill="#fff"/>
    <path d="M113 238H135M113 245H130M113 252H126" stroke="#b8c5f5" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M115 288H133V304H115ZM119 285V291M129 285V291" fill="none" stroke="#b8c5f5" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="124" cy="351" r="9" fill="none" stroke="#b8c5f5" stroke-width="2.2"/>
    <path d="M109 373Q124 355 139 373" fill="none" stroke="#b8c5f5" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="124" cy="486" r="16" fill="#8193df"/>
    <path d="M118 486H130M124 480V492" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Header -->
    <text x="193" y="116" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8190a9">LEARNING CENTER</text>
    <text x="193" y="147" font-size="26" font-weight="700" fill="#253253">Build a brighter future.</text>
    <text x="193" y="170" font-size="13" fill="#7b879d">Choose a lesson and continue at your own pace.</text>
    <rect x="720" y="102" width="112" height="39" rx="19.5" fill="#f1f3fb"/>
    <circle cx="742" cy="121.5" r="12" fill="#dbe3ff"/>
    <path d="M736 122L740 126L748 117" fill="none" stroke="#5068cf" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="762" y="126" font-size="12" font-weight="700" fill="#506080">6 courses</text>

    <!-- Progress banner -->
    <rect x="192" y="194" width="640" height="111" rx="20" fill="url(#education-banner)"/>
    <circle cx="762" cy="249" r="72" fill="#fff" fill-opacity=".08"/>
    <circle cx="806" cy="201" r="42" fill="#fff" fill-opacity=".07"/>
    <text x="218" y="225" font-size="12" font-weight="700" letter-spacing="1.4" fill="#dfe5ff">YOUR LEARNING</text>
    <text x="218" y="256" font-size="23" font-weight="700" fill="#fff">Three lessons completed</text>
    <text x="218" y="279" font-size="12" fill="#e2e6ff">Keep going — every lesson adds up.</text>
    <rect x="546" y="234" width="218" height="12" rx="6" fill="#fff" fill-opacity=".22"/>
    <rect x="546" y="234" width="142" height="12" rx="6" fill="#ffd18a"/>
    <text x="546" y="270" font-size="12" font-weight="700" fill="#fff">65% complete</text>
    <circle cx="793" cy="249" r="28" fill="#fff" fill-opacity=".94"/>
    <path d="M783 250L790 257L805 241" fill="none" stroke="#6377d7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Course catalog -->
    <text x="192" y="344" font-size="17" font-weight="700" fill="#2c3858">Popular courses</text>
    <text x="832" y="344" text-anchor="end" font-size="12" font-weight="700" fill="#667bd7">View all</text>

    <g filter="url(#education-card-shadow)">
      <rect x="192" y="365" width="196" height="132" rx="17" fill="#fbf5eb"/>
      <rect x="410" y="365" width="196" height="132" rx="17" fill="#eef7f4"/>
      <rect x="628" y="365" width="204" height="132" rx="17" fill="#f1effb"/>
    </g>

    <!-- Web design course -->
    <rect x="209" y="381" width="62" height="51" rx="13" fill="#f6c99c"/>
    <rect x="219" y="391" width="42" height="28" rx="4" fill="#fff8ec"/>
    <path d="M219 399H261M226 410L233 404L240 411L250 402L258 409" fill="none" stroke="#d48761" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="288" y="395" font-size="10" font-weight="700" letter-spacing="1" fill="#b17c59">DESIGN</text>
    <text x="288" y="418" font-size="15" font-weight="700" fill="#463b39">Web Design</text>
    <text x="209" y="457" font-size="11" fill="#8d7d72">8 lessons</text>
    <rect x="209" y="471" width="153" height="7" rx="3.5" fill="#eadfd6"/>
    <rect x="209" y="471" width="92" height="7" rx="3.5" fill="#db956c"/>

    <!-- Coding course -->
    <rect x="427" y="381" width="62" height="51" rx="13" fill="#bfe2d6"/>
    <rect x="438" y="391" width="40" height="29" rx="5" fill="#fff"/>
    <path d="M452 400L446 406L452 412M464 400L470 406L464 412M461 397L455 415" fill="none" stroke="#3e8471" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="506" y="395" font-size="10" font-weight="700" letter-spacing="1" fill="#5b8d80">CODING</text>
    <text x="506" y="418" font-size="15" font-weight="700" fill="#304740">Programming</text>
    <text x="427" y="457" font-size="11" fill="#788d86">12 lessons</text>
    <rect x="427" y="471" width="153" height="7" rx="3.5" fill="#dceae5"/>
    <rect x="427" y="471" width="54" height="7" rx="3.5" fill="#5da48e"/>

    <!-- Language course -->
    <rect x="645" y="381" width="62" height="51" rx="13" fill="#d8d0f2"/>
    <path d="M660 393H692V417H676L667 424V417H660Z" fill="#fff"/>
    <text x="676" y="411" text-anchor="middle" font-size="15" font-weight="700" fill="#705cae">A</text>
    <text x="724" y="395" font-size="10" font-weight="700" letter-spacing="1" fill="#7f70ad">LANGUAGE</text>
    <text x="724" y="418" font-size="15" font-weight="700" fill="#413b59">English Basics</text>
    <text x="645" y="457" font-size="11" fill="#827d94">10 lessons</text>
    <rect x="645" y="471" width="161" height="7" rx="3.5" fill="#e2def0"/>
    <rect x="645" y="471" width="120" height="7" rx="3.5" fill="#8874c4"/>

    <!-- Small Pashto localization detail -->
    <rect x="720" y="160" width="112" height="24" rx="12" fill="#f1effb"/>
    <text x="776" y="177" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-size="11" font-weight="700" fill="#6554a8" xml:lang="ps">د زده کړې مرکز</text>
  </g>
</svg>
