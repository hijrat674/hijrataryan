      <circle cx="740" cy="307" r="7" fill="#62ad83"/><circle cx="761" cy="307" r="7" fill="#62ad83"/><circle cx="782" cy="307" r="7" fill="#62ad83"/>
      <circle cx="803" cy="307" r="7" fill="#e0a478"/><circle cx="740" cy="333" r="7" fill="#62ad83"/><circle cx="761" cy="333" r="7" fill="#62ad83"/>
      <circle cx="782" cy="333" r="7" fill="#62ad83"/><circle cx="803" cy="333" r="7" fill="#e0a478"/>
    </g>

    <rect x="108" y="388" width="463" height="112" rx="18" fill="#fafbfa" stroke="#e5ebe8"/>
    <text x="128" y="415" font-size="12" font-weight="700" fill="#405750">Today's activity</text>
    <text x="530" y="415" text-anchor="end" font-size="10" fill="#879790">6 AM - 6 PM</text>
    <path d="M132 473H548M132 444H548" stroke="#e8eeeb"/>
    <path d="M139 475C171 471 182 452 215 455C247 458 259 437 291 442C324 447 341 420 372 427C406 434 420 405 451 415C483 425 500 397 538 404" fill="none" stroke="#e97859" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M139 475C171 471 182 452 215 455C247 458 259 437 291 442C324 447 341 420 372 427C406 434 420 405 451 415C483 425 500 397 538 404V485H139Z" fill="#f3a27e" opacity=".12"/>
    <g fill="#e97859"><circle cx="215" cy="455" r="4"/><circle cx="291" cy="442" r="4"/><circle cx="372" cy="427" r="4"/><circle cx="451" cy="415" r="4"/><circle cx="538" cy="404" r="4"/></g>
    <g font-size="9" fill="#9ba8a3" text-anchor="middle"><text x="139" y="493">6 AM</text><text x="239" y="493">9 AM</text><text x="339" y="493">12 PM</text><text x="439" y="493">3 PM</text><text x="538" y="493">6 PM</text></g>

    <rect x="586" y="388" width="245" height="112" rx="18" fill="#fff" stroke="#e5ebe8" filter="url(#petrol-card-shadow)"/>
    <text x="605" y="415" font-size="12" font-weight="700" fill="#405750">Station services</text>
    <rect x="605" y="431" width="61" height="51" rx="13" fill="#fff0e6"/>
