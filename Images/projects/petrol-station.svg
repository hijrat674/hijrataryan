    <rect x="676" y="431" width="61" height="51" rx="13" fill="#edf6f1"/>
    <path d="M693 464H719M697 464V446H715V464M702 452H710" fill="none" stroke="#4f8b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="747" y="431" width="65" height="51" rx="13" fill="#f1eff9"/>
    <path d="M763 464H797M768 464V450H792V464M774 450V443H786V450" fill="none" stroke="#746b9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-size="8.5" fill="#71807b" text-anchor="middle"><text x="635.5" y="493">Car wash</text><text x="706.5" y="493">Shop</text><text x="779.5" y="493">Service</text></g>
  </g>
</svg>
