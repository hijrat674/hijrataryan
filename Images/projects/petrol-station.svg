<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="petrol-title petrol-desc">
  <title id="petrol-title">Petrol station services dashboard illustrated preview</title>
  <desc id="petrol-desc">An original pastel illustration of a petrol station dashboard with fuel prices, pump availability, service cards, and a daily activity chart.</desc>
  <defs>
    <linearGradient id="petrol-bg" x2="1" y2="1">
      <stop stop-color="#fff2e7"/>
      <stop offset="1" stop-color="#e9f4ef"/>
    </linearGradient>
    <linearGradient id="petrol-panel" x2="1" y2="1">
      <stop stop-color="#214d49"/>
      <stop offset="1" stop-color="#2e625a"/>
    </linearGradient>
    <linearGradient id="petrol-accent" x2="1">
      <stop stop-color="#ed8d5d"/>
      <stop offset="1" stop-color="#e46e55"/>
    </linearGradient>
    <filter id="petrol-shadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dy="16" stdDeviation="20" flood-color="#294f49" flood-opacity=".13"/>
    </filter>
    <filter id="petrol-card-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dy="7" stdDeviation="9" flood-color="#394d49" flood-opacity=".1"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#petrol-bg)"/>
  <circle cx="83" cy="55" r="154" fill="#f9d9be" opacity=".72"/>
  <circle cx="917" cy="573" r="181" fill="#cfe7dd" opacity=".76"/>
  <path d="M728 0H960V159C911 176 863 164 831 132C797 98 786 46 728 0Z" fill="#f5e1b8" opacity=".45"/>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="68" width="800" height="464" rx="30" fill="#fff" filter="url(#petrol-shadow)"/>
    <circle cx="110" cy="95" r="4" fill="#ddd8d2"/>
    <circle cx="126" cy="95" r="4" fill="#ddd8d2"/>
    <circle cx="142" cy="95" r="4" fill="#ddd8d2"/>

    <rect x="80" y="118" width="800" height="67" fill="url(#petrol-panel)"/>
    <rect x="108" y="135" width="34" height="34" rx="10" fill="#f6ad76"/>
    <path d="M116 160V143Q116 140 119 140H130Q133 140 133 143V160M119 146H130M133 146L140 151V160" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="155" y="158" font-size="18" font-weight="700" fill="#fff">FuelPoint</text>
    <g font-size="12" fill="#d9ece6">
      <text x="547" y="157">Overview</text>
      <text x="623" y="157">Services</text>
      <text x="690" y="157">Stations</text>
    </g>
    <rect x="775" y="135" width="75" height="33" rx="16.5" fill="#fff" fill-opacity=".13"/>
    <circle cx="794" cy="151.5" r="8" fill="#f7bb8c"/>
    <text x="811" y="156" font-size="10" font-weight="700" fill="#fff">OPEN</text>

    <text x="108" y="225" font-size="25" font-weight="700" fill="#243e3a">Good morning.</text>
    <text x="108" y="248" font-size="13" fill="#7b8c87">Your station is running smoothly today</text>
    <rect x="108" y="269" width="224" height="100" rx="18" fill="#fff6ed" stroke="#f0dfcf"/>
    <text x="127" y="294" font-size="11" font-weight="700" letter-spacing="1.2" fill="#a47a5d">REGULAR</text>
    <text x="127" y="337" font-size="29" font-weight="700" fill="#493d37">$1.18</text>
    <text x="202" y="336" font-size="11" fill="#9a8171">per litre</text>
    <path d="M277 293C277 293 261 315 261 326C261 338 269 346 280 346C291 346 299 338 299 326C299 315 283 293 283 293Z" fill="#ef9566" opacity=".9"/>

    <rect x="347" y="269" width="224" height="100" rx="18" fill="#eef7f2"/>
    <text x="366" y="294" font-size="11" font-weight="700" letter-spacing="1.2" fill="#66897c">PREMIUM</text>
    <text x="366" y="337" font-size="29" font-weight="700" fill="#314b45">$1.34</text>
    <text x="441" y="336" font-size="11" fill="#789188">per litre</text>
    <circle cx="524" cy="320" r="24" fill="#d8ede2"/>
    <path d="M517 332V309Q517 305 521 305H530Q534 305 534 309V332M521 312H530" fill="none" stroke="#4d8b72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="586" y="269" width="245" height="100" rx="18" fill="#f3f1fa"/>
    <text x="605" y="294" font-size="11" font-weight="700" letter-spacing="1.2" fill="#77718f">PUMP STATUS</text>
    <text x="605" y="329" font-size="26" font-weight="700" fill="#3d3951">6 / 8</text>
    <text x="605" y="349" font-size="11" fill="#88839a">pumps available</text>
