<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Online examination illustrated preview</title>
  <desc id="desc">An original illustration of an examination application showing a multiple choice question, progress dots, and a timed assessment.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef0ff"/><stop offset="1" stop-color="#f7e9f2"/></linearGradient><filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dy="16" stdDeviation="20" flood-color="#635ba9" flood-opacity=".13"/></filter></defs>
  <rect width="960" height="600" fill="url(#bg)"/><circle cx="110" cy="592" r="189" fill="#ddd9fa" opacity=".7"/><circle cx="901" cy="10" r="150" fill="#f0cfe1" opacity=".6"/>
  <g font-family="Arial, sans-serif">
    <rect x="86" y="72" width="788" height="456" rx="28" fill="#fff" filter="url(#shadow)"/>
    <rect x="120" y="106" width="43" height="43" rx="13" fill="#ede9ff"/><path d="M131 117H151V139H131ZM136 124H146M136 130H143" stroke="#8074c5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="128" font-size="23" font-weight="700" fill="#383052">A moment to test yourself.</text><text x="179" y="149" font-size="12" fill="#9d94ac">Online examination</text>
    <rect x="710" y="108" width="125" height="42" rx="13" fill="#f6f3fc"/><circle cx="733" cy="129" r="8" stroke="#9788bd" fill="none" stroke-width="2"/><path d="M733 123V129L737 132" stroke="#9788bd" fill="none" stroke-width="2" stroke-linecap="round"/><text x="754" y="134" font-size="16" font-weight="700" fill="#766597">08:45</text>
    <path d="M121 174H835" stroke="#efecf4"/>
    <text x="123" y="208" font-size="11" font-weight="700" letter-spacing="2" fill="#a094b5">QUESTION 04 OF 10</text>
    <rect x="121" y="225" width="483" height="57" rx="13" fill="#f7f5fc"/><text x="140" y="260" font-size="18" font-weight="700" fill="#4a3d63">Which data structure follows FIFO?</text>
    <rect x="121" y="299" width="483" height="46" rx="12" fill="#fbfaff" stroke="#eae5f3"/><circle cx="147" cy="322" r="10" fill="#f0edf7"/><text x="147" y="326" text-anchor="middle" font-size="11" fill="#9588aa">A</text><text x="170" y="327" font-size="14" fill="#8c819e">Stack</text>
    <rect x="121" y="355" width="483" height="46" rx="12" fill="#eee9ff" stroke="#9d8bd8"/><circle cx="147" cy="378" r="10" fill="#8b76ce"/><path d="M142 378L146 382L152 374" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="383" font-size="14" font-weight="700" fill="#685295">Queue</text>
    <rect x="121" y="411" width="483" height="46" rx="12" fill="#fbfaff" stroke="#eae5f3"/><circle cx="147" cy="434" r="10" fill="#f0edf7"/><text x="147" y="438" text-anchor="middle" font-size="11" fill="#9588aa">C</text><text x="170" y="439" font-size="14" fill="#8c819e">Tree</text>
    <rect x="632" y="198" width="203" height="259" rx="18" fill="#f7f4fb"/><text x="652" y="228" font-size="13" font-weight="700" fill="#7c6a99">Your progress</text>
    <g font-size="13" text-anchor="middle"><g fill="#d3c8ed"><circle cx="665" cy="266" r="17"/><circle cx="714" cy="266" r="17"/><circle cx="763" cy="266" r="17"/></g><g fill="#7963b6"><text x="665" y="271">1</text><text x="714" y="271">2</text><text x="763" y="271">3</text></g><circle cx="665" cy="316" r="17" fill="#8a73c7"/><text x="665" y="321" fill="#fff">4</text><g fill="#ece6f4"><circle cx="714" cy="316" r="17"/><circle cx="763" cy="316" r="17"/><circle cx="665" cy="366" r="17"/><circle cx="714" cy="366" r="17"/><circle cx="763" cy="366" r="17"/></g><g fill="#b0a4be"><text x="714" y="321">5</text><text x="763" y="321">6</text><text x="665" y="371">7</text><text x="714" y="371">8</text><text x="763" y="371">9</text></g></g>
    <rect x="652" y="407" width="162" height="8" rx="4" fill="#e8e0f2"/><rect x="652" y="407" width="65" height="8" rx="4" fill="#a895d3"/><text x="652" y="437" font-size="11" fill="#a294b2">One question at a time.</text>
    <text x="123" y="496" font-size="12" fill="#b1a6bb">Your answer is selected</text><rect x="665" y="473" width="170" height="34" rx="11" fill="#8b75c7"/><text x="750" y="495" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Next question  →</text>
  </g>
</svg>
